{% extends 'base.html' %}

{% block content %}
<section id="products-page" class="fullscreen-section" style="height: auto; min-height: 100vh; padding-top: 120px; background-color: var(--bg-dark);">
    <div class="horizontal-header text-fade-up">
        <h2 class="serif-title">Thương Quán <br><span class="gold-text">Buôn Làng</span></h2>
        <p>Những sản vật tinh hoa do chính tay đồng bào làm ra</p>
    </div>
    
    <div style="display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; max-width: 1200px; margin: 50px auto; padding-bottom: 100px;">
        
        <!-- Bún Song Thằn -->
        <div class="h-item product-card text-fade-up" data-id="bun_song_than" data-price="150000" data-name="Bún Song Thằn">
            <div class="h-item-img">
                <img src="https://images.unsplash.com/photo-1589301773809-77c867a5f6e8?q=80&w=800&auto=format&fit=crop" alt="Bún Song Thằn">
                <div class="image-overlay">
                    <button class="btn-primary" style="padding: 10px 20px; font-size: 0.8rem;" onclick="triggerAction('add_to_cart', 'bun_song_than')">Mua ngay</button>
                </div>
            </div>
            <div class="h-item-info">
                <h3>Bún Song Thằn</h3>
                <p class="price-tag gold-text">150.000 ₫</p>
            </div>
        </div>

        <!-- Vải Thổ Cẩm -->
        <div class="h-item product-card text-fade-up" data-id="vai_tho_cam" data-price="350000" data-name="Vải Thổ Cẩm">
            <div class="h-item-img">
                <img src="https://images.unsplash.com/photo-1528698827591-e19ccd7bc23d?q=80&w=800&auto=format&fit=crop" alt="Thổ Cẩm">
                <div class="image-overlay">
                    <button class="btn-primary" style="padding: 10px 20px; font-size: 0.8rem;" onclick="triggerAction('add_to_cart', 'vai_tho_cam')">Mua ngay</button>
                </div>
            </div>
            <div class="h-item-info">
                <h3>Vải Thổ Cẩm</h3>
                <p class="price-tag gold-text">350.000 ₫</p>
            </div>
        </div>
        
        <!-- Rượu Cần -->
        <div class="h-item product-card text-fade-up" data-id="ruou_can" data-price="280000" data-name="Rượu Cần Men Lá">
            <div class="h-item-img">
                <img src="https://images.unsplash.com/photo-1594963363385-d6029d5b03fb?q=80&w=800&auto=format&fit=crop" alt="Rượu Cần">
                <div class="image-overlay">
                    <button class="btn-primary" style="padding: 10px 20px; font-size: 0.8rem;" onclick="triggerAction('add_to_cart', 'ruou_can')">Mua ngay</button>
                </div>
            </div>
            <div class="h-item-info">
                <h3>Rượu Cần Men Lá</h3>
                <p class="price-tag gold-text">280.000 ₫</p>
            </div>
        </div>
        
        <!-- Gùi Đan -->
        <div class="h-item product-card text-fade-up" data-id="gui_dan" data-price="120000" data-name="Gùi Đan Mây Tre">
            <div class="h-item-img">
                <img src="https://images.unsplash.com/photo-1598462058356-d66ff0d04fb4?q=80&w=800&auto=format&fit=crop" alt="Gùi Đan">
                <div class="image-overlay">
                    <button class="btn-primary" style="padding: 10px 20px; font-size: 0.8rem;" onclick="triggerAction('add_to_cart', 'gui_dan')">Mua ngay</button>
                </div>
            </div>
            <div class="h-item-info">
                <h3>Gùi Đan Mây Tre</h3>
                <p class="price-tag gold-text">120.000 ₫</p>
            </div>
        </div>

    </div>
</section>

<!-- Inline script để báo cho Già Làng nói chuyện -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const narratorText = document.getElementById('narrator-text');
    if (narratorText) {
        setTimeout(() => {
            gsap.to(narratorText, { opacity: 0, duration: 0.3, onComplete: () => {
                narratorText.textContent = "Cháu muốn mua gì mang về xuôi làm quà không? Nhớ mua Bún Song Thằn nhé!";
                gsap.to(narratorText, { opacity: 1, duration: 0.5 });
            }});
        }, 1000);
    }
});
</script>
{% endblock %}
