<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Già Làng Số</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Libraries -->
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>

<body>
    <!-- HEADER -->
    <header class="navbar">
        <div class="logo">GIÀ LÀNG.</div>
        <nav class="links">
            <a href="/" class="nav-link">Trang Chủ</a>
            <a href="/products" class="nav-link">Thương Quán</a>
            <a href="/heritage" class="nav-link">Chuyện Làng</a>
            <button id="cart-toggle-btn" class="cart-btn">
                <span>Giỏ Hàng</span>
                <span id="cart-count" class="badge">0</span>
            </button>
        </nav>
    </header>

    <!-- MAIN SCROLL CONTAINER -->
    <main id="smooth-wrapper">
        <!-- NARRATOR OVERLAY (Floating AI Text) -->
        <div id="narrator-overlay">
            <div class="narrator-container">
                <h2 id="narrator-text"></h2>
            </div>
        </div>

        <div id="smooth-content">
            {% block content %}{% endblock %}

            <footer class="footer">
                <div class="footer-content">
                    <h2 class="footer-title">Lưu Giữ Hồn Núi Rừng</h2>
                    <p>&copy; 2026 Dự án Bảo tồn Di sản Gia Lai. Mọi sản phẩm đều được làm thủ công bởi nghệ nhân địa
                        phương.</p>
                </div>
            </footer>
        </div>
    </main>

    <!-- NARRATOR OVERLAY (AI Text Area) -->
    <div id="narrator-overlay" class="pointer-events-none">
        <div class="narrator-container">
            <p id="narrator-text"></p>
        </div>
    </div>

    <!-- CART SIDEBAR UI -->
    <div id="cart-sidebar" class="cart-hidden">
        <div class="cart-header">
            <h3>Giỏ Hàng Của Bạn</h3>
            <button id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-body">
            <ul id="cart-items">
                <!-- Cart items will be injected here -->
            </ul>
        </div>
        <div class="cart-footer">
            <div class="cart-total">Tổng: <span id="cart-total-price">0</span> VNĐ</div>
            <button id="checkout-btn" class="btn-primary full-width">Thanh Toán</button>
        </div>
    </div>
    <div id="cart-overlay" class="cart-hidden"></div>

    <!-- INTERACTIVE STORY MODAL (Replaces normal product modal) -->
    <div id="story-modal" class="hidden">
        <div class="story-modal-bg"></div>
        <div class="story-content-wrapper">
            <button id="close-story-modal">&times;</button>
            <div class="story-split">
                <!-- Left: Visuals -->
                <div class="story-visual">
                    <img id="story-product-img" src="" alt="Product">
                </div>
                <!-- Right: Interactive Narrative -->
                <div class="story-interactive">
                    <h2 id="story-title" class="serif-title">Tên Sản Phẩm</h2>
                    <p id="story-narrative" class="narrative-text">Già Làng đang nhớ lại câu chuyện...</p>

                    <div id="story-chat-area">
                        <div id="story-history"></div>
                        <div class="story-input-box">
                            <input type="text" id="story-input"
                                placeholder="Hỏi Già về sản vật này, hoặc nói 'Già ơi, cho cháu mua 1 cái'...">
                            <button id="story-send-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/app.js"></script>
</body>

</html>
